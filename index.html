<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="/hero-ascii-poster.webp" fetchpriority="high" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d0d0d" />

    <title>Santiago Palma — Portfolio</title>
    <meta name="description" content="Portfolio de Santiago Palma. Proyectos de software, producto y desarrollo web." />
    <meta name="author" content="Santiago Palma" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Las metaetiquetas sociales exigen URL ABSOLUTA: con una ruta relativa, los rastreadores
         de WhatsApp, Twitter, LinkedIn y Slack no resuelven la imagen y el enlace se comparte sin
         previsualizacion. El dominio sale de VITE_SITE_URL (.env), que Vite sustituye al construir. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Santiago Palma" />
    <meta property="og:title" content="Santiago Palma — Portfolio" />
    <meta property="og:description" content="Portfolio de Santiago Palma. Proyectos de software, producto y desarrollo web." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="800" />
    <meta property="og:image:alt" content="Portfolio de Santiago Palma" />
    <meta property="og:locale" content="es_MX" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Santiago Palma — Portfolio" />
    <meta name="twitter:description" content="Portfolio de Santiago Palma. Proyectos de software, producto y desarrollo web." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta name="twitter:image:alt" content="Portfolio de Santiago Palma" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
